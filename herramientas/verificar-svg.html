<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Verificar SVG</title>
    <!-- Herramienta interna (no se publica): ver el comentario de
         verificar-svg.js. Necesita servidor local, no funciona con doble clic. -->
    <style>
      body { font-family: system-ui, sans-serif; margin: 24px; max-width: 1100px; }
      textarea { width: 100%; height: 280px; font: 12px/1.4 Consolas, monospace; }
      pre { background: #f3f5f9; padding: 12px; white-space: pre-wrap; }
      /* Los iframes necesitan tamaño real para que los generadores dibujen,
         pero no hace falta verlos. */
      iframe.banco { position: absolute; left: -3000px; width: 1200px; height: 900px; }
    </style>
  </head>
  <body>
    <h1>Verificar SVG de los generadores</h1>
    <p><button id="correr">Correr los 42 casos</button></p>
    <h2>Resultado (nombre, tamaño, SHA-256 abreviado)</h2>
    <textarea id="resultado" readonly></textarea>
    <h2>Corrida anterior (pegar aquí)</h2>
    <textarea id="anterior"></textarea>
    <p><button id="comparar">Comparar</button></p>
    <pre id="comparacion"></pre>
    <script src="verificar-svg.js" defer></script>
  </body>
</html>

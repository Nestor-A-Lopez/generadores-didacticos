<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><title>Movimiento</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--surface-page);font-family:var(--font-sans)}.lbl{font-family:var(--font-sans);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted)}.mono{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}@keyframes slide{0%,12%{transform:translateX(0)}60%,100%{transform:translateX(150px)}}</style></head><body>
<div style="display:flex;flex-direction:column;gap:12px">
<div style="display:flex;align-items:center;gap:16px"><div style="width:70px;font-family:var(--font-mono);font-size:11px;color:var(--text-muted)">fast</div><div style="width:190px;height:10px;background:var(--blue-50);border-radius:999px;position:relative;overflow:hidden"><div style="width:40px;height:10px;border-radius:999px;background:var(--action-primary);animation:slide 1.8s var(--ease-out) infinite alternate"></div></div><div style="font-size:12px;color:var(--text-body)"><b style="font-weight:500">140ms</b> · Tinte de hover, foco</div></div><div style="display:flex;align-items:center;gap:16px"><div style="width:70px;font-family:var(--font-mono);font-size:11px;color:var(--text-muted)">base</div><div style="width:190px;height:10px;background:var(--blue-50);border-radius:999px;position:relative;overflow:hidden"><div style="width:40px;height:10px;border-radius:999px;background:var(--action-primary);animation:slide 2.2s var(--ease-out) infinite alternate"></div></div><div style="font-size:12px;color:var(--text-body)"><b style="font-weight:500">220ms</b> · Aparición de paneles, cambio de pestaña</div></div><div style="display:flex;align-items:center;gap:16px"><div style="width:70px;font-family:var(--font-mono);font-size:11px;color:var(--text-muted)">slow</div><div style="width:190px;height:10px;background:var(--blue-50);border-radius:999px;position:relative;overflow:hidden"><div style="width:40px;height:10px;border-radius:999px;background:var(--action-primary);animation:slide 2.6s var(--ease-out) infinite alternate"></div></div><div style="font-size:12px;color:var(--text-body)"><b style="font-weight:500">380ms</b> · Barra de progreso, revelar el desarrollo</div></div><div style="display:flex;align-items:center;gap:16px"><div style="width:70px;font-family:var(--font-mono);font-size:11px;color:var(--text-muted)">scene</div><div style="width:190px;height:10px;background:var(--blue-50);border-radius:999px;position:relative;overflow:hidden"><div style="width:40px;height:10px;border-radius:999px;background:var(--action-primary);animation:slide 3s var(--ease-out) infinite alternate"></div></div><div style="font-size:12px;color:var(--text-body)"><b style="font-weight:500">700ms</b> · Transición entre escenas de un simulador</div></div>
</div>
<p style="font-size:12px;color:var(--text-muted);margin:14px 0 0">Curva por defecto <code style="font-family:var(--font-mono)">--ease-out</code>: entra rápido, se posa lento. Nada rebota.</p>
</body></html>

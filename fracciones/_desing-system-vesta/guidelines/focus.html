<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><title>Foco</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--surface-page);font-family:var(--font-sans)}.lbl{font-family:var(--font-sans);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted)}.mono{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}</style></head><body>
<div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">
<span style="padding:11px 20px;border-radius:999px;background:var(--action-primary);color:#fff;font-size:15px;font-weight:500">reposo</span>
<span style="padding:11px 20px;border-radius:999px;background:var(--action-primary-hover);color:#fff;font-size:15px;font-weight:500">hover</span>
<span style="padding:11px 20px;border-radius:999px;background:var(--action-primary-active);color:#fff;font-size:15px;font-weight:500;transform:translateY(1px);display:inline-block">press</span>
<span style="padding:11px 20px;border-radius:999px;background:var(--action-primary);color:#fff;font-size:15px;font-weight:500;box-shadow:var(--ring-focus)">foco</span>
<span style="padding:11px 20px;border-radius:999px;background:var(--action-disabled-bg);color:var(--action-disabled-fg);font-size:15px;font-weight:500">inactivo</span>
<span style="padding:11px 20px;border-radius:var(--radius-md);background:#fff;border:1px solid var(--red-500);box-shadow:var(--ring-error);font-size:15px;color:var(--text-muted)">error</span>
</div></body></html>

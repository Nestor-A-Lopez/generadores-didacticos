<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><title>Superficies</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--surface-page);font-family:var(--font-sans)}.lbl{font-family:var(--font-sans);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted)}.mono{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}</style></head><body>
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px">
<div style="background:var(--surface-page);color:var(--text-body);border:1px solid var(--border-default);border-radius:var(--radius-lg);padding:14px;height:112px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:var(--shadow-sm)"><div style="font-size:13px;font-weight:500">Página</div><div style="font-family:var(--font-mono);font-size:11px;opacity:.7">--surface-page</div></div><div style="background:var(--surface-sunken);color:var(--blue-800);border:1px solid transparent;border-radius:var(--radius-lg);padding:14px;height:112px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:var(--shadow-sm)"><div style="font-size:13px;font-weight:500">Hundida</div><div style="font-family:var(--font-mono);font-size:11px;opacity:.7">--surface-sunken</div></div><div style="background:var(--surface-card);color:var(--text-body);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:14px;height:112px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:var(--shadow-sm)"><div style="font-size:13px;font-weight:500">Tarjeta</div><div style="font-family:var(--font-mono);font-size:11px;opacity:.7">--surface-card</div></div><div style="background:var(--surface-inverse);color:#fff;border:1px solid transparent;border-radius:var(--radius-lg);padding:14px;height:112px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:var(--shadow-sm)"><div style="font-size:13px;font-weight:500">Inversa</div><div style="font-family:var(--font-mono);font-size:11px;opacity:.7">--surface-inverse</div></div>
</div></body></html>

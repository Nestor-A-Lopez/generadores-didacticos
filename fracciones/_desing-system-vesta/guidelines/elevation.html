<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><title>Sombras</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--surface-page);font-family:var(--font-sans)}.lbl{font-family:var(--font-sans);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted)}.mono{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}</style></head><body>
<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:18px;padding:6px 2px 24px">
<div><div style="height:84px;background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);box-shadow:var(--shadow-xs)"></div><div style="margin-top:12px;font-size:12px;font-weight:500;color:var(--text-body)">xs</div><div class="mono">--shadow-xs</div></div><div><div style="height:84px;background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm)"></div><div style="margin-top:12px;font-size:12px;font-weight:500;color:var(--text-body)">sm</div><div class="mono">--shadow-sm</div></div><div><div style="height:84px;background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);box-shadow:var(--shadow-md)"></div><div style="margin-top:12px;font-size:12px;font-weight:500;color:var(--text-body)">md</div><div class="mono">--shadow-md</div></div><div><div style="height:84px;background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg)"></div><div style="margin-top:12px;font-size:12px;font-weight:500;color:var(--text-body)">lg</div><div class="mono">--shadow-lg</div></div><div><div style="height:84px;background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);box-shadow:var(--shadow-xl)"></div><div style="margin-top:12px;font-size:12px;font-weight:500;color:var(--text-body)">xl</div><div class="mono">--shadow-xl</div></div>

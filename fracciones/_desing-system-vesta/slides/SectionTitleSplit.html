<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><title>Separador split</title><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}.slide{width:1280px;height:720px;position:relative;overflow:hidden;background:var(--surface-page);font-family:var(--font-sans);box-sizing:border-box}.pad{padding:72px 88px;height:100%;box-sizing:border-box}.eyebrow{font-size:14px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--blue-600)}.eyebrow.on-dark{color:var(--blue-200)}.d{font-family:var(--font-serif-display);font-variation-settings:'opsz' 144;font-weight:600;letter-spacing:-.025em;line-height:1.06;color:var(--text-heading);margin:0}.b{font-size:20px;line-height:1.55;color:var(--text-body);margin:0}.footline{position:absolute;left:0;right:88px;height:1px;background:var(--border-default)}.wm{position:absolute;right:88px;font-family:var(--font-serif-display);font-variation-settings:'opsz' 48;font-size:18px;font-weight:600;letter-spacing:-.03em;color:var(--neutral-400)}.blob{position:absolute;border-radius:58% 42% 47% 53% / 44% 51% 49% 56%}.ghostnum{position:absolute;font-family:var(--font-serif-display);font-variation-settings:'opsz' 144;font-weight:600;line-height:1;color:transparent;-webkit-text-stroke:2px var(--blue-100)}</style></head><body><div class="slide" style="display:flex">
<div class="pad" style="flex:1;display:flex;flex-direction:column;justify-content:center">
<div class="eyebrow">Sección 01</div>
<h2 class="d" style="font-size:52px;margin-top:20px">¿Completo mi jerarquía?</h2>
<p class="b" style="margin-top:20px;max-width:34ch">Cuántas unidades, decenas y centenas hacen falta para pasar al siguiente escalón.</p>
</div>
<div style="width:340px;background:var(--surface-sunken);position:relative;overflow:hidden">
<div class="blob" style="background:var(--blue-500);left:60px;top:120px;width:220px;height:220px;opacity:.7"></div><div class="blob" style="background:var(--blue-800);left:-40px;top:380px;width:200px;height:200px;opacity:.55"></div>
</div><div class="footline" style="top:642px;background:var(--border-default)"></div><div class="wm" style="top:654px;color:var(--neutral-400)">Vesta</div></div></body></html>

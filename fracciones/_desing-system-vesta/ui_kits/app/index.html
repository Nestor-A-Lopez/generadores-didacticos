<!DOCTYPE html><html lang="es"><head>
<meta charset="utf-8"><title>Vesta — Aplicación</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0}</style>
</head><body><div id="root"></div>
<script type="text/babel" src="../website/SiteChrome.jsx"></script>
<script type="text/babel" src="AppChrome.jsx"></script>
<script type="text/babel" src="LoginScreen.jsx"></script>
<script type="text/babel" src="DashboardScreen.jsx"></script>
<script type="text/babel" src="WorkspaceScreen.jsx"></script>
<script type="text/babel" src="ProgressScreen.jsx"></script>
<script type="text/babel">
function App(){
  const [screen,setScreen]=React.useState('login');
  if(screen==='login') return <window.LoginScreen onEnter={()=>setScreen('panel')}/>;
  if(screen==='leccion') return <div style={{display:'flex',minHeight:'100vh'}}><window.Sidebar screen="aula" onNavigate={setScreen}/><div style={{flex:1,minWidth:0,display:'flex',flexDirection:'column'}}><window.WorkspaceScreen onExit={()=>setScreen('panel')}/></div></div>;
  const Body = screen==='avance'?window.ProgressScreen:window.DashboardScreen;
  return <div style={{display:'flex',minHeight:'100vh'}}>
    <window.Sidebar screen={screen==='aula'?'aula':screen} onNavigate={setScreen}/>
    <div style={{flex:1,minWidth:0,display:'flex',flexDirection:'column'}}><Body onOpenLesson={()=>setScreen('leccion')}/></div>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body></html>

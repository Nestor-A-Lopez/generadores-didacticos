# Publica en GitHub Pages solo la carpeta sitio/ (portada, generadores y
# compartido/). Lo demás del repositorio (Vesta, herramientas, CLAUDE.md)
# no se publica.
#
# Las acciones oficiales van fijadas por commit (con la versión en el
# comentario) para que una versión nueva no cambie el flujo sin avisar.
name: Publicar sitio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Una sola publicación a la vez; si llega otro push, se deja terminar la actual.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # Copia de sitio/ sin los CLAUDE.md (notas de trabajo, no son para el
      # sitio) ni SVG sueltos, por si alguno se colara en el repositorio.
      - name: Preparar la copia que se publica
        run: |
          cp -r sitio _site
          find _site \( -name CLAUDE.md -o -iname '*.svg' \) -delete
          find _site -type f | sort

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><title>TextColorPicker</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{padding:56px 24px 24px;background:var(--surface-page)}.row{display:flex;gap:48px;align-items:flex-start}</style></head><body><div id="root"></div>
<script type="text/babel">
const { TextColorPicker } = window.VestaDesignSystem_a1e3d1;
const opts=[{hex:'#000000',label:'Negro (original)'},{hex:'#FFFFFF',label:'Blanco'}];
function Demo(){const [a,setA]=React.useState('#000000');const [b,setB]=React.useState('#3A7BD5');
return <div className="row">
<TextColorPicker label="Color del número" options={opts} value={a} onChange={setA} customLabel="Elige otro color para el número"/>
<TextColorPicker label="Color de la llave" options={opts} value={b} onChange={setB} customLabel="Elige otro color para la llave y su valor"/>
</div>}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>

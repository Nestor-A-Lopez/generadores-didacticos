<!-- @dsCard group="forms" viewport="560x400" name="SwitchMenu" subtitle="Interruptor con menú plegable; 9px entre pistas contiguas" -->
<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><title>SwitchMenu</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{padding:24px;background:var(--surface-page);font-family:var(--font-sans)}.col{display:flex;flex-direction:column;gap:6px}.lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted)}.note{font-size:var(--text-sm);color:var(--text-muted);margin:0 0 12px}</style></head><body><div id="root"></div>
<script type="text/babel">
const { SwitchMenu, SwitchGroup, Input, SegmentedControl } = window.VestaDesignSystem_a1e3d1;
function Demo(){const [a,setA]=React.useState(true);const [b,setB]=React.useState(true);const [m,setM]=React.useState('auto');
return <div style={{maxWidth:420}}>
<p className="note">Entre pistas contiguas: 9px (margin-top: -9px).</p>
<SwitchGroup>
<SwitchMenu label="Mostrar valor total del entero" checked={a} onChange={e=>setA(e.target.checked)}>
<div className="col"><label htmlFor="ve" className="lbl">Valor del entero</label><Input id="ve" defaultValue="1" style={{width:160}}/></div>
</SwitchMenu>
<SwitchMenu label="Mostrar valor de cada parte" checked={b} onChange={e=>setB(e.target.checked)}>
<div className="col"><span id="vp" className="lbl">Valor de cada parte</span><SegmentedControl aria-labelledby="vp" value={m} onChange={setM} options={[{value:'auto',label:'Automático'},{value:'custom',label:'Personalizado'}]}/></div>
</SwitchMenu>
</SwitchGroup>
</div>}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>

<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><title>InputWithPrefix</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{padding:24px;background:var(--surface-page)}.col{display:flex;flex-direction:column;gap:8px}.lbl{font-family:var(--font-sans);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted)}</style></head><body><div id="root"></div>
<script type="text/babel">
const { InputWithPrefix } = window.VestaDesignSystem_a1e3d1;
function Demo(){const [p,setP]=React.useState(Array.from({length:15},(_,i)=>i<3?'1/15':''));
return <div style={{display:'flex',flexDirection:'column',gap:20}}>
<div className="col"><span className="lbl">Las 15 partes</span>
<div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill, minmax(128px, 1fr))',gap:8,padding:12,background:'var(--surface-sunken)',borderRadius:'var(--radius-md)'}}>
{p.map((v,i)=><InputWithPrefix key={i} prefix={i+1} prefixWidth={28} accessibleLabel={`Parte ${i+1}`} value={v} placeholder="1/15" onChange={e=>{const n=[...p];n[i]=e.target.value;setP(n);}}/>)}
</div></div>
<div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
<InputWithPrefix prefix="Numerador" defaultValue="3"/>
<InputWithPrefix prefix="Denominador" defaultValue="15"/>
</div></div>}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>

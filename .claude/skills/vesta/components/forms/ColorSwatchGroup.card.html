<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><title>ColorSwatchGroup</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{padding:24px;background:var(--surface-page)}.col{display:flex;flex-direction:column;gap:8px;max-width:420px}.lbl{font-family:var(--font-sans);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted)}</style></head><body><div id="root"></div>
<script type="text/babel">
const { ColorSwatchGroup } = window.VestaDesignSystem_a1e3d1;
const colores=[{value:'morado',label:'Morado',hex:'#8080F0'},{value:'azul',label:'Azul',hex:'#2ED9D9'},{value:'naranja',label:'Naranja',hex:'#F48600'},{value:'rojo',label:'Rojo',hex:'#E8384F'},{value:'verde',label:'Verde',hex:'#7CBF33'},{value:'amarillo',label:'Amarillo',hex:'#FFD500',checkColor:'var(--blue-950)'}];
function Demo(){const [c,setC]=React.useState('morado');const [hex,setHex]=React.useState('#3A7BD5');
return <div className="col"><span id="relleno" className="lbl">Color del relleno</span>
<ColorSwatchGroup aria-labelledby="relleno" colors={colores} value={c} onChange={setC} customColor={hex} onCustomColorChange={setHex}/></div>}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>

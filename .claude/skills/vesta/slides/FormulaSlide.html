<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><title>Fórmula</title><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}.slide{width:1280px;height:720px;position:relative;overflow:hidden;background:var(--surface-page);display:flex;font-family:var(--font-sans)}.pad{padding:80px 96px}.eyebrow{font-size:15px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--blue-600)}.d{font-family:var(--font-serif-display);font-variation-settings:'opsz' 144;font-weight:600;letter-spacing:-.025em;line-height:1.04;color:var(--text-heading);margin:0}.b{font-size:24px;line-height:1.55;color:var(--text-body);margin:0}.wm{position:absolute;right:48px;bottom:40px;font-family:var(--font-serif-display);font-variation-settings:'opsz' 48;font-size:22px;font-weight:600;letter-spacing:-.03em;color:var(--neutral-400)}.blob{position:absolute;border-radius:58% 42% 47% 53% / 44% 51% 49% 56%}</style></head><body><div class="slide">
<div class="blob" style="background:var(--blue-50);left:-180px;top:420px;width:520px;height:520px;"></div>
<div class="pad" style="position:relative;width:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center">
<div class="eyebrow" style="color:var(--subject-physics)">Física · Caída libre</div>
<h2 class="d" style="font-size:48px;margin-top:22px;max-width:20ch">La altura no depende del peso</h2>
<div style="margin-top:52px;background:var(--surface-sunken);border-radius:var(--radius-lg);padding:56px 96px;font-family:var(--font-math);font-size:76px;color:var(--text-heading)">h = ½ · g · t²</div>
<p class="b" style="margin-top:32px;font-size:21px;color:var(--text-muted);max-width:52ch">h es la altura recorrida; g, la gravedad del lugar; t, el tiempo que el cuerpo lleva cayendo.</p>
</div><div class="wm">Vesta</div></div></body></html>

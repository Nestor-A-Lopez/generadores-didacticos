<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><title>Disciplinas</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--surface-page);font-family:var(--font-sans)}.lbl{font-family:var(--font-sans);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted)}.mono{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}</style></head><body>
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px">
<div><div style="height:58px;border-radius:var(--radius-md);background:var(--subject-math)"></div><div style="margin-top:8px;font-size:13px;font-weight:500;color:var(--text-body)">Matemáticas</div><div class="mono">--subject-math</div></div><div><div style="height:58px;border-radius:var(--radius-md);background:var(--subject-physics)"></div><div style="margin-top:8px;font-size:13px;font-weight:500;color:var(--text-body)">Física</div><div class="mono">--subject-physics</div></div><div><div style="height:58px;border-radius:var(--radius-md);background:var(--subject-electronics)"></div><div style="margin-top:8px;font-size:13px;font-weight:500;color:var(--text-body)">Electrónica</div><div class="mono">--subject-electronics</div></div><div><div style="height:58px;border-radius:var(--radius-md);background:var(--subject-code)"></div><div style="margin-top:8px;font-size:13px;font-weight:500;color:var(--text-body)">Programación</div><div class="mono">--subject-code</div></div>
</div>
<p style="font-size:12px;color:var(--text-muted);margin:14px 0 0">Sólo para la cinta superior de una lección y los filtros del catálogo. Nunca como fondo de texto largo.</p>
</body></html>

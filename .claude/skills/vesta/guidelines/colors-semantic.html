<!-- @dsCard group="Colors" viewport="700x200" name="Semánticos de feedback" subtitle="Correcto, casi, todavía no — y la nota informativa" -->
<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><title>Semánticos</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--surface-page);font-family:var(--font-sans)}.lbl{font-family:var(--font-sans);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted)}.mono{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}</style></head><body>
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px">
<div style="background:var(--feedback-correct-bg);color:var(--feedback-correct-fg);border-left:3px solid var(--feedback-correct-line);border-radius:0 10px 10px 0;padding:14px 14px;height:128px;display:flex;flex-direction:column;justify-content:space-between"><div style="font-weight:600;font-size:14px">Correcto</div><div class="mono" style="color:inherit;opacity:.75;line-height:1.6">--feedback-correct-bg<br>--feedback-correct-fg<br>--feedback-correct-line</div></div><div style="background:var(--feedback-retry-bg);color:var(--feedback-retry-fg);border-left:3px solid var(--feedback-retry-line);border-radius:0 10px 10px 0;padding:14px 14px;height:128px;display:flex;flex-direction:column;justify-content:space-between"><div style="font-weight:600;font-size:14px">Casi</div><div class="mono" style="color:inherit;opacity:.75;line-height:1.6">--feedback-retry-bg<br>--feedback-retry-fg<br>--feedback-retry-line</div></div><div style="background:var(--feedback-error-bg);color:var(--feedback-error-fg);border-left:3px solid var(--feedback-error-line);border-radius:0 10px 10px 0;padding:14px 14px;height:128px;display:flex;flex-direction:column;justify-content:space-between"><div style="font-weight:600;font-size:14px">Todavía no</div><div class="mono" style="color:inherit;opacity:.75;line-height:1.6">--feedback-error-bg<br>--feedback-error-fg<br>--feedback-error-line</div></div><div style="background:var(--feedback-info-bg);color:var(--feedback-info-fg);border-left:3px solid var(--feedback-info-line);border-radius:0 10px 10px 0;padding:14px 14px;height:128px;display:flex;flex-direction:column;justify-content:space-between"><div style="font-weight:600;font-size:14px">Información</div><div class="mono" style="color:inherit;opacity:.75;line-height:1.6">--feedback-info-bg<br>--feedback-info-fg<br>--feedback-info-line</div></div>
</div></body></html>

<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Generador de tablas de valor posicional</title>
    <!-- Ícono de la pestaña: el de este generador en la portada (Lucide
         «table-2», con el fondo --blue-50 y el trazo --blue-800 de su
         tarjeta), incrustado para que funcione también con doble clic. -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23e3f2fd'/%3E%3Cg transform='translate(4 4)' fill='none' stroke='%230d47a1' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M9 3H5a2 2 0 0 0-2 2v4m6-6h10a2 2 0 0 1 2 2v4M9 3v18m0 0h10a2 2 0 0 0 2-2V9M9 21H5a2 2 0 0 1-2-2V9m0 0h18'/%3E%3C/g%3E%3C/svg%3E" />
    <link rel="stylesheet" href="../compartido/vesta.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <div class="topbar">
        <div class="headerMarca">
          <!-- El mismo ícono que en la tarjeta de la portada (Lucide «table-2»,
               licencia ISC: ver AVISOS-DE-TERCEROS.md en la raíz del repositorio). -->
          <span class="icono" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3H5a2 2 0 0 0-2 2v4m6-6h10a2 2 0 0 1 2 2v4M9 3v18m0 0h10a2 2 0 0 0 2-2V9M9 21H5a2 2 0 0 1-2-2V9m0 0h18"/></svg>
          </span>
          <div>
            <h1>Generador de tablas de valor posicional</h1>
            <p>
              Configura la tabla y descarga el resultado como SVG para pegarlo en
              PowerPoint. La vista previa se actualiza al instante, sin botón
              "aplicar".
            </p>
          </div>
        </div>
      </div>

      <div class="toolbar">
        <div class="group">
          <span class="caption">Rango</span>
          <div class="row2">
            <select id="hastaOrden">
              <option value="0">Unidades</option>
              <option value="1">Decenas de unidad</option>
              <option value="2">Centenas de unidad</option>
              <option value="5" selected>Centenas de millar</option>
              <option value="8">Centenas de millón</option>
              <option value="11">Centenas de millares de millón</option>
            </select>
            <select id="hastaOrdenDecimal">
              <option value="0" selected>No mostrar decimales</option>
              <option value="-1">Décimos</option>
              <option value="-2">Centésimos</option>
              <option value="-3">Milésimos</option>
            </select>
          </div>
        </div>
        <div class="divider"></div>

        <div class="group grow">
          <span class="caption">Números</span>
          <div id="numerosList"></div>
          <button
            type="button"
            class="btn btn-outline"
            id="addNumero"
            style="width: fit-content"
          >
            + Agregar número
          </button>
        </div>
        <div class="divider"></div>

        <div class="group">
          <span class="caption">Color</span>
          <input
            type="color"
            id="colorDigitos"
            value="#000000"
            style="
              width: 52px;
              height: 40px;
              padding: 2px;
              border: 1px solid var(--border-default);
              border-radius: var(--radius-sm);
              cursor: pointer;
              background: #fff;
            "
          />
        </div>
        <div class="divider"></div>

        <div class="group grow" style="min-width: 440px">
          <span class="caption">Presentación</span>
          <div class="checkGroup">
            <label class="checkbox"
              ><input type="checkbox" id="mostrarPeriodos" checked /><span
                class="box"
                >✓</span
              >Mostrar periodos</label
            >
            <label class="checkbox"
              ><input type="checkbox" id="mostrarClase" checked /><span
                class="box"
                >✓</span
              >Mostrar clases</label
            >
            <label class="checkbox"
              ><input type="checkbox" id="coma" checked /><span class="box"
                >✓</span
              >Mostrar comas y apóstrofes</label
            >
            <label class="checkbox"
              ><input type="checkbox" id="mostrarPunto" checked /><span
                class="box"
                >✓</span
              >Mostrar punto decimal</label
            >
          </div>
        </div>

        <button type="button" class="btn btn-primary" id="downloadBtn">
          Guardar SVG…
        </button>
      </div>

      <div class="callout" id="errorCallout" style="display: none">
        <div>
          <strong>No se puede generar la tabla</strong>
          <span id="errorMessage"></span>
        </div>
      </div>

      <div class="stage">
        <div class="stage-inner">
          <div id="svgHolder">
            <div class="loading">Cargando vista previa…</div>
          </div>
        </div>
      </div>
    </div>
    <script src="../compartido/glifos-tabla.js" defer></script>
    <script src="../compartido/guardar-svg.js" defer></script>
    <script src="script.js" defer></script>
  </body>
</html>
